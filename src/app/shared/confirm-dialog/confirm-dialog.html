<div class="app-dialog-backdrop" *ngIf="open" (click)="cancelled.emit()">
  <div
    #dialogRef
    class="app-dialog"
    role="dialog"
    aria-modal="true"
    tabindex="-1"
    [attr.aria-labelledby]="tituloId"
    [attr.aria-describedby]="mensajeId"
    (click)="$event.stopPropagation()"
  >
    <h2 class="app-dialog-title" [id]="tituloId">{{ title }}</h2>
    <p class="app-dialog-message" [id]="mensajeId">{{ message }}</p>
    <div class="app-dialog-actions">
      <app-button variant="secondary" type="button" (click)="cancelled.emit()">Cancelar</app-button>
      <app-button variant="danger" type="button" (click)="confirmed.emit()">{{
        confirmText
      }}</app-button>
    </div>
  </div>
</div>
