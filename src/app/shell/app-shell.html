<div class="shell">
  <header class="shell-header">
    <div class="shell-brand">
      <span class="shell-logo" aria-hidden="true"></span>
      <span class="shell-name">Gestor de Horarios</span>
    </div>

    <nav class="shell-nav">
      <a class="shell-link" routerLink="/asignaturas" routerLinkActive="is-active">Asignaturas</a>
      <a class="shell-link" routerLink="/horarios" routerLinkActive="is-active">Horarios</a>
    </nav>

    <div class="shell-actions">
      <app-theme-toggle></app-theme-toggle>
      <button class="shell-logout" type="button" routerLink="/login">
        <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </header>

  <main class="shell-content">
    <router-outlet></router-outlet>
  </main>
</div>
