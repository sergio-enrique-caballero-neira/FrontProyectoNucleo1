<section class="page">
  <div class="page-head">
    <div>
      <h1 class="page-title">Horarios</h1>
      <p class="page-subtitle">Gestiona los horarios y sus bloques semanales</p>
    </div>
    <app-button type="button" (click)="nuevo()">Nuevo horario</app-button>
  </div>

  <ng-container *ngIf="items.length; else empty">
    <app-data-table>
      <thead>
        <tr>
          <th>Código</th>
          <th>Carrera</th>
          <th>Bloques</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of items">
          <td>{{ item.codigo }}</td>
          <td>{{ item.carrera }}</td>
          <td>{{ item.bloques.length }}</td>
          <td>
            <button class="row-action" type="button" (click)="ver(item.id)">Ver</button>
            <button class="row-action" type="button" (click)="editar(item)">Editar</button>
            <button class="row-action row-action--danger" type="button" (click)="abrirEliminar(item)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </app-data-table>
  </ng-container>

  <ng-template #empty>
    <app-empty-state message="Aún no hay horarios registrados."></app-empty-state>
  </ng-template>

  <app-confirm-dialog
    [open]="confirmOpen"
    title="Eliminar horario"
    message="¿Estás seguro de que deseas eliminar este horario y todos sus bloques? Esta acción no se puede deshacer."
    (confirmed)="confirmar()"
    (cancelled)="cancelar()">
  </app-confirm-dialog>
</section>
