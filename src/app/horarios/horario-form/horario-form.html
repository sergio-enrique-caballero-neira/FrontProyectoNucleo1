<section class="page">
  <div class="page-head">
    <div>
      <h1 class="page-title">{{ isEdit ? 'Editar horario' : 'Nuevo horario' }}</h1>
      <p class="page-subtitle">
        {{ isEdit ? 'Modifica los datos del horario' : 'Registra un nuevo horario' }}
      </p>
    </div>
  </div>

  <app-alert-message type="success" [message]="alert" *ngIf="alert"></app-alert-message>

  <form class="form-card" (ngSubmit)="guardar()">
    <app-form-field label="Código" forId="codigo" [error]="errors['codigo'] || ''">
      <input id="codigo" name="codigo" type="text" [(ngModel)]="form.codigo" placeholder="Ej. HIS-2026-1" />
    </app-form-field>

    <app-form-field label="Carrera" forId="carrera" [error]="errors['carrera'] || ''">
      <input id="carrera" name="carrera" type="text" [(ngModel)]="form.carrera" placeholder="Ej. Ingeniería de Sistemas" />
    </app-form-field>

    <div class="form-actions">
      <app-button variant="secondary" type="button" (click)="cancelar()">Cancelar</app-button>
      <app-button type="submit">Guardar</app-button>
    </div>
  </form>
</section>
