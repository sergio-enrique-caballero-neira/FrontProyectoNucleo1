<section class="page">
  <div class="page-head">
    <div>
      <h1 class="page-title">{{ isEdit ? 'Editar horario' : 'Nuevo horario' }}</h1>
      <p class="page-subtitle">
        {{ isEdit ? 'Modifica los datos del horario' : 'Registra un nuevo horario' }}
      </p>
    </div>
  </div>

  <app-alert-message type="error" [message]="error" *ngIf="error"></app-alert-message>

  <form class="form-card" (ngSubmit)="guardar()">
    <app-form-field #codigoField label="Código" forId="codigo" [error]="errors['codigo'] || ''">
      <input
        id="codigo"
        name="codigo"
        type="text"
        [(ngModel)]="form.codigo"
        placeholder="Ej. HIS-2026-1"
        [attr.aria-describedby]="codigoField.describedBy"
      />
    </app-form-field>

    <app-form-field #carreraField label="Carrera" forId="carrera" [error]="errors['carrera'] || ''">
      <input
        id="carrera"
        name="carrera"
        type="text"
        [(ngModel)]="form.carrera"
        placeholder="Ej. Ingeniería de Sistemas"
        [attr.aria-describedby]="carreraField.describedBy"
      />
    </app-form-field>

    <div class="form-actions">
      <app-button variant="secondary" type="button" (click)="cancelar()">Cancelar</app-button>
      <app-button type="submit" [disabled]="guardando">Guardar</app-button>
    </div>
  </form>
</section>
