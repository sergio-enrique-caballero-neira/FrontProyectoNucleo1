<div class="login-page">
  <div class="login-bg" aria-hidden="true">
    <span class="orb orb--one"></span>
    <span class="orb orb--two"></span>
    <span class="orb orb--three"></span>
    <div class="grid-overlay"></div>
  </div>
  <div class="login-glow" aria-hidden="true"></div>

  <main class="login">
    <section class="login-card" aria-label="Formulario de recuperación de contraseña">
      <div class="login-head">
        <h1 class="login-title">Recuperar contraseña</h1>
        <p class="login-subtitle">Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña</p>
      </div>

      <form class="login-form">
        <label class="field">
          <i class="fa-solid fa-envelope field-icon" aria-hidden="true"></i>
          <input class="field-input" id="correo" name="correo" type="email" placeholder=" " autocomplete="email" required />
          <span class="field-label">Correo electrónico</span>
        </label>

        <div class="login-options">
          <a class="link" routerLink="/">Volver a iniciar sesión</a>
        </div>

        <button class="btn-login" type="submit">
          <span class="btn-login-text">Enviar enlace</span>
          <i class="fa-solid fa-paper-plane btn-login-icon" aria-hidden="true"></i>
        </button>
      </form>
    </section>
  </main>
</div>
